[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-grover"
dynamic = ["version"]
description = "A JAX implementation of the GROVER molecular representation model (dual-view GTransformer encoder)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jax",
    "numpy",
    "rdkit",
]

[project.optional-dependencies]
convert = ["torch"]
testing = ["pytest", "torch"]
lint = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "jax_grover.__version__" }

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E741"]  # ambiguous variable name - GROVER uses q/k/v, a1/a2, etc.

[tool.ruff.lint.isort]
known-first-party = ["jax_grover"]
